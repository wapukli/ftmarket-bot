# fly.toml app configuration file generated for ftmarket-botftmarket-bot on 2026-11-23T21:20:36Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'ftmarket-botftmarket-bot'
primary_region = 'ord'

[build]
  dockerfile = 'Dockerfile'

[env]
  DB_PATH = '/data/ftmarket.db'

[[mounts]]
  source = 'ftmarket_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
